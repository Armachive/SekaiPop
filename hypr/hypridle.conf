# Idle handling. The lock itself is the shell's lockscreen (ipc call lock lock); hyprlock is
# only a fallback if the shell is not running (optional: leave it uninstalled and the fallback
# just does nothing).
$lock_cmd = qs -c sekaipop ipc call lock lock || pidof hyprlock || hyprlock

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Hyprland sometimes drops keyboard focus from the lock surface after a wake.
    after_sleep_cmd = qs -c sekaipop ipc call lock focus
    inhibit_sleep = 3
}

# The idle times (lock, screen off, sleep or hibernate) are set in Settings > General >
# Idle & sleep, which writes them to this file and restarts hypridle. Out of the box:
# lock after 5 minutes, screen off after 10, sleep after 15. Don't add listener blocks
# here as well, or both sets run.
source = ~/.config/sekaipop/idle.conf
